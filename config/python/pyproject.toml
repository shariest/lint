[project]
name = "sena-python-tools"
version = "0.0.0"
requires-python = ">=3.9"

# Source ownership and the exact four-file allowlist live in
# scripts/check-source-inventory.sh and scripts/lint.sh. Keeping scope out of
# this file makes the canonical config independent of its docs/lint location.
[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
    "ARG",
    "RUF",
]
ignore = [
    # Korean prose intentionally contains Unicode punctuation and symbols.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.9"
strict = true
show_error_codes = true
show_error_context = true
pretty = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pptx", "pptx.*"]
ignore_missing_imports = true
